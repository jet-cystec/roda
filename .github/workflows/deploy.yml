# .github/workflows/deploy.yml

name: Deploy site

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # If you have a requirements.txt, uncomment the next step
      # - name: Install dependencies
      #   run: pip install -r requirements.txt

      - name: Build site
        run: python build_site.py

      - name: Prepare production index
        run: cp index.min.html index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          # If you want to publish the minified file only, you could set:
          # publish_dir: .
          # keep_files: false
